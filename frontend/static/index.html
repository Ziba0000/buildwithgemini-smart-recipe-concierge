<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Recipe & Pantry Concierge</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --accent: #d97706;
    --accent-hover: #b45309;
    --accent-light: #fef3c7;
    --accent-gradient: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(217, 119, 6, 0.08);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* --- Header --- */
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(217, 119, 6, 0.25);
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text-main);
    line-height: 1.2;
  }
  .brand-subtitle {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: #16a34a;
    background: #f0fdf4;
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
    border: 1px solid #bbf7d0;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #16a34a;
    box-shadow: 0 0 0 2px #dcfce7;
  }

  /* --- Dialogue / Chat Container --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 85%;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .msg.user .avatar {
    background: var(--accent-light);
    color: var(--accent);
  }
  .msg.agent .avatar {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--accent);
    box-shadow: var(--shadow-sm);
  }

  .msg-content {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .msg-sender {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: 0.2rem;
  }
  .msg.user .msg-sender {
    text-align: right;
    margin-right: 0.2rem;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    box-shadow: var(--shadow-sm);
  }
  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .msg.agent .bubble {
    background: var(--card-bg);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    white-space: normal;
    width: 100%;
  }

  /* --- Prompt Shortcuts --- */
  .prompt-row {
    display: flex;
    gap: 0.6rem;
    padding: 0.6rem 1.5rem 0.2rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    flex-wrap: wrap;
    justify-content: center;
  }
  .prompt-btn {
    background: var(--card-bg);
    color: var(--text-main);
    border: 1px solid var(--border);
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .prompt-btn:hover {
    background: var(--accent-light);
    color: var(--accent-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  /* --- Footer Input Form --- */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1.2rem 1.5rem;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .input-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  input {
    width: 100%;
    padding: 0.85rem 1.2rem;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text-main);
    outline: none;
    transition: all 0.2s ease;
  }
  input:focus {
    border-color: var(--accent);
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.12);
  }
  button.send-btn {
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 24px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 2px 8px rgba(217, 119, 6, 0.25);
    transition: all 0.2s ease;
  }
  button.send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
  }

  /* --- A2UI Component Enhancements --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem;
    background: #ffffff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-main); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">
      <span class="material-symbols-outlined" style="color:#fff; font-size:1.5rem;">restaurant</span>
    </div>
    <div>
      <div class="brand-title">Smart Recipe & Pantry Concierge</div>
      <div class="brand-subtitle">Culinary AI • Powered by Gemini & Agent Engine</div>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span> Online
  </div>
</header>

<div id="log"></div>

<div class="prompt-row">
  <button type="button" class="prompt-btn" onclick="sendPrompt('Show my pantry items')">
    <span>🥗</span> Show my pantry items
  </button>
  <button type="button" class="prompt-btn" onclick="sendPrompt('Find chicken pasta recipes')">
    <span>🍝</span> Find chicken pasta recipes
  </button>
  <button type="button" class="prompt-btn" onclick="sendPrompt('Generate image for avocado toast')">
    <span>📷</span> Generate image for avocado toast
  </button>
</div>

<form id="form">
  <div class="input-wrapper">
    <input id="input" placeholder="Ask for a recipe, pantry inventory, or nutritional math…" autocomplete="off" autofocus>
  </div>
  <button type="submit" class="send-btn">
    <span>Send</span>
    <span class="material-symbols-outlined" style="color:#fff; font-size:1.1rem;">send</span>
  </button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "🧑" : "🍳");
  const content = el("div", "msg-content");
  const sender = el("div", "msg-sender", who === "user" ? "You" : "Concierge");
  const b = el("div", "bubble");

  content.appendChild(sender);
  content.appendChild(b);

  m.appendChild(avatar);
  m.appendChild(content);

  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply).
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
